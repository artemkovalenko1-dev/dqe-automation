[pytest]
pythonpath = ..
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    parquet_data: data quality checks of aggregated Parquet datasets (source = Postgres, target = Parquet)
    smoke: lightweight availability checks (dataset is present and not empty)
    example: sample tests demonstrating the framework usage (not part of the parquet_data run)
    facility_name_min_time_spent_per_visit_date: checks for the facility_name_min_time_spent_per_visit_date dataset
    facility_type_avg_time_spent_per_visit_date: checks for the facility_type_avg_time_spent_per_visit_date dataset
    patient_sum_treatment_cost_per_facility_type: checks for the patient_sum_treatment_cost_per_facility_type dataset
